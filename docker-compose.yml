services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: confluence-bot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
      - ./certs:/certs:ro
    environment:
      - LLM_URL
      - LLM_API_KEY
      - CONFLUENCE_URL
      - CONFLUENCE_USERNAME
      - CONFLUENCE_TOKEN
      - CONFLUENCE_SPACE_KEY
      - EMBEDDING_MODEL
      - VECTOR_DB_MODE
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: confluence-bot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

  proxy:
    image: caddy:2-alpine
    container_name: confluence-bot-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  chroma_data:
    driver: local
  caddy_data:
  caddy_config:
